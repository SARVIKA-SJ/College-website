<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APPLICATION FORM</title>
  <style>
        
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      perspective: 1000px; /* Added perspective */
    }

    header {
      background: linear-gradient(135deg, #4caf50, #2196f3);
      color: #fff;
      padding: 20px 0;
      text-align: center;
      margin-bottom: 30px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }
       
    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      text-align: center;
    }   
    
    
    h3 {
      font-size: 1.4em;
      margin-top: 20px;
      color: #333;
      text-align: center;

    }


     .logo1,
    .logo2 {
      max-width: 100px;
      border-radius: 50%;
      margin: 0 10px;
    }

    .abtdiv {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .heading {
      font-size: 2.5em;
      color: #fff;
      margin-left: 20px;
    }
    
    form {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      margin: 0 auto;
    }

    label {
      display: inline-block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .form-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group label {
      width: 150px;      /* equal label width = perfect alignment */
      font-weight: bold;
    }

    .form-group input,
    .form-group select {
      width: 300px;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }


    input[type="submit"] {  
        background: linear-gradient(135deg, #4caf50, #2196f3);
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        text-align: center;
        width: 100%;
        }

     .form-container:hover{
         transform: translateY(-5px); 
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
     }

    </style>
    </head>

<body>
      <header>
    <div class="abtdiv">
      <img class="logo1" src="images/logo.jpeg" alt="image 1">
      <h1 class="heading">APPLICATION FORM</h1>
    </div>
  </header>
    
    <h3>Please fill out the application form below to apply for the program.</h3>
    
     <form action="/submit_application" method="post" class="form-container">

    <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>
    </div>

    <div class="form-group">
        <label for="program">Select Program:</label>
        <select id="program" name="program" required>
            <option>select one</option>
            <option value="program1">BCOM</option>
            <option value="program2">BBA</option>
            <option value="program3">BCA</option>
        </select>
    </div>

    <input type="submit" value="Submit Application">

</form>

</body>
</html>
